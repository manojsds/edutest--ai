services:
  - type: web
    name: edutest-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: LLM_PROVIDER_ORDER
        value: gemini,groq
      - key: GEMINI_MODELS
        value: gemini-1.5-flash,gemini-1.5-flash-8b
      - key: GROQ_MODELS
        value: llama-3.1-8b-instant,llama-3.3-70b-versatile
      - key: LLM_MAX_RETRIES
        value: 3
      # ⚠️ Set these in Render Dashboard → Environment (never commit secrets):
      # GEMINI_API_KEY
      # GROQ_API_KEY
      # FIREBASE_SERVICE_ACCOUNT_KEY  (paste entire JSON as one line)
      # JWT_SECRET                    (random 32+ char string)
      # FRONTEND_URL                  (your Vercel URL)
      # RAZORPAY_KEY_ID
      # RAZORPAY_KEY_SECRET
